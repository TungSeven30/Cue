<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WhisperDesk app icon — Cue">
  <defs>
    <linearGradient id="cBg" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A313C"/>
      <stop offset="1" stop-color="#101318"/>
    </linearGradient>
    <radialGradient id="cGlow" cx="512" cy="380" r="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2BC8CD" stop-opacity="0.20"/>
      <stop offset="0.65" stop-color="#2BC8CD" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#2BC8CD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cWarm" cx="512" cy="760" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0AC4E" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#F0AC4E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cWave" x1="256" y1="52" x2="256" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FE8DB"/>
      <stop offset="1" stop-color="#1FB6C9"/>
    </linearGradient>
    <linearGradient id="cText" x1="86" y1="356" x2="426" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6C069"/>
      <stop offset="1" stop-color="#E89A3C"/>
    </linearGradient>
    <clipPath id="cSquircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- icon body with macOS-style margin and shadow -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#101318" filter="url(#cShadow)"/>
  <g clip-path="url(#cSquircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#cBg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#cGlow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#cWarm)"/>
  </g>
  <!-- Cue mark, centered on the body -->
  <g transform="translate(192 189.5) scale(1.25)">
    <rect x="86"  y="126" width="44" height="100" rx="22" fill="url(#cWave)"/>
    <rect x="160" y="88"  width="44" height="176" rx="22" fill="url(#cWave)"/>
    <rect x="234" y="52"  width="44" height="248" rx="22" fill="url(#cWave)"/>
    <rect x="308" y="88"  width="44" height="176" rx="22" fill="url(#cWave)"/>
    <rect x="382" y="126" width="44" height="100" rx="22" fill="url(#cWave)"/>
    <rect x="86"  y="356" width="340" height="44" rx="22" fill="url(#cText)"/>
    <rect x="156" y="420" width="200" height="44" rx="22" fill="url(#cText)"/>
  </g>
</svg>
