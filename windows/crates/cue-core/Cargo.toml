[package]
name = "cue-core"
description = "Platform-neutral Cue pipeline: segments, cleanup, chunk planning, subtitle I/O, audio extraction, model catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
regex = "1"
encoding_rs = "0.8"
unicode-normalization = "0.1"
unicode-segmentation = "1"
sha2 = "0.10"
hex = "0.4"
hound = "3.5"
dirs = "6"
ureq = { version = "3", features = ["platform-verifier"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
tempfile = "3"
