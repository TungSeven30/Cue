[package]
name = "cue-runtime"
description = "The desktop app's engine room: job list, two-slot queue, persistence and events, independent of any UI toolkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
vulkan = ["cue-engine/vulkan"]
cuda = ["cue-engine/cuda"]

[dependencies]
cue-core.workspace = true
cue-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "6"
hex = "0.4"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
