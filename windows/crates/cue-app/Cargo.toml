[package]
name = "cue-app"
description = "Cue for Windows: the desktop app (Tauri shell over cue-runtime)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "cue-desktop"
path = "src/main.rs"

[features]
vulkan = ["cue-runtime/vulkan"]
cuda = ["cue-runtime/cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cue-core.workspace = true
cue-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
